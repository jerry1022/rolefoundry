# Local-only identity test stack. Hosted settings are documented separately.
project_id = "rolefoundry-identity"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = false
[realtime]
enabled = false
[analytics]
enabled = false
[edge_runtime]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3200"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
token_verifications = 1000
[auth.email]
enabled = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 600
[auth.email.template.confirmation]
subject = "Your RoleFoundry sign-in code"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.magic_link]
subject = "Your RoleFoundry sign-in code"
content_path = "./supabase/templates/magic_link.html"
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/identity_before_user_created"
