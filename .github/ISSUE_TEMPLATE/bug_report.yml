name: Bug report
description: Report a reproducible problem in the workspace
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior. Do not include private information.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS and screen size
