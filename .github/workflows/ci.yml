name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run recovery:test
      - run: npm run resume:test
      - run: npm run docs:check
      - run: npm run architecture:check
      - run: npm run i18n:check
      - run: npm run theme:check
      - run: npm run worker:demo
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: NEXT_PUBLIC_BASE_PATH=/rolefoundry npm run build:pages
      - run: test ! -d out/api
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run identity:start
      - run: npm run identity:test
      - name: Verify private scrape, firing and resolved monitoring pipeline
        run: npm run metrics:rehearse
      - name: Verify failed monitoring startup cleans owned resources
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const result = spawnSync(process.execPath, ['scripts/rehearse-metrics.mjs', '--fail-after-start'], { encoding: 'utf8', timeout: 420000 });
          writeFileSync('.local/metrics-failure.log', `${result.stdout || ''}\n${result.stderr || ''}`, { mode: 0o600 });
          if (result.status !== 1 || !result.stderr.includes('Intentional owned monitoring cleanup rehearsal.') || !result.stdout.includes('Authenticated Prometheus scrape') || !result.stdout.includes("Removed this run's monitoring containers"))
            throw Error('Expected deliberate failure after an authenticated scrape and successful cleanup.');
          console.log('Deliberate monitoring failure cleaned its owned resources.');
          JS
          test -z "$(docker ps -aq --filter label=com.rolefoundry.metrics-run)"
          test -z "$(docker network ls -q --filter label=com.rolefoundry.metrics-run)"
      - name: Rehearse isolated local database recovery
        run: npm run recovery:local
      - name: Verify failed recovery cleans its owned artifacts
        run: npm run recovery:local -- --verify-failure-cleanup
      - name: Verify post-backup deletion against isolated services
        run: npm run recovery:local -- --verify-deletion-replay
      - name: Verify isolated recovery service failure cleanup
        run: npm run recovery:local -- --verify-deletion-replay-failure
      - name: Stop local identity services
        if: always()
        run: npm run identity:stop
  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build independent worker runtime
        run: docker build -f Dockerfile.worker -t rolefoundry-worker:ci .
      - name: Verify runtime imports and missing-secret startup
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const result = spawnSync('docker', ['run', '--rm', 'rolefoundry-worker:ci'], {encoding:'utf8', timeout:10000});
          if (result.status !== 1 || !result.stderr.includes('Worker configuration is missing or invalid') || result.stderr.includes('ERR_MODULE_NOT_FOUND'))
            throw Error('Worker image startup check failed.');
          console.log('Worker runtime imports resolve; missing configuration fails closed.');
          JS

      - name: Verify isolated resume runtime in Linux
        run: node scripts/check-resume-worker-image.mjs rolefoundry-worker:ci

      - name: Verify private account archive runtime in Linux
        run: node scripts/check-account-worker-image.mjs rolefoundry-worker:ci
      - name: Build independent course link checker
        run: docker build -f Dockerfile.course-links -t rolefoundry-course-links:ci .
      - name: Verify checker configuration and disabled-source startup
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const missing = spawnSync('docker', ['run', '--rm', 'rolefoundry-course-links:ci', 'node', '--conditions=react-server', '--import', 'tsx', 'apps/course-links/src/main.ts', '--once'], { encoding:'utf8', timeout:15000 });
          if (missing.status !== 1 || !missing.stderr.includes('Course link storage configuration is missing.') || missing.stderr.includes('ERR_MODULE_NOT_FOUND')) throw Error('Checker missing-configuration guard failed.');
          const disabled = spawnSync('docker', ['run', '--rm', '-e', 'SUPABASE_URL=https://fixture.invalid', '-e', 'SUPABASE_SERVICE_ROLE_KEY=synthetic-not-a-real-credential', 'rolefoundry-course-links:ci', 'node', '--conditions=react-server', '--import', 'tsx', 'apps/course-links/src/main.ts', '--once'], { encoding:'utf8', timeout:15000 });
          if (disabled.status !== 0 || !disabled.stdout.includes('"enabledSources":0')) throw Error('Checker disabled-source startup failed.');
          console.log('Checker imports/configuration resolve; empty policy performs no network check.');
          JS
