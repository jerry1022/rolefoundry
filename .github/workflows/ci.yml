name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run resume:test
      - run: npm run docs:check
      - run: npm run architecture:check
      - run: npm run worker:demo
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: NEXT_PUBLIC_BASE_PATH=/rolefoundry npm run build:pages
      - run: test ! -d out/api
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run identity:start
      - run: npm run identity:test
      - name: Rehearse isolated local database recovery
        run: npm run recovery:local
      - name: Verify failed recovery cleans its owned artifacts
        run: npm run recovery:local -- --verify-failure-cleanup
      - name: Stop local identity services
        if: always()
        run: npm run identity:stop
  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build independent worker runtime
        run: docker build -f Dockerfile.worker -t rolefoundry-worker:ci .
      - name: Verify runtime imports and missing-secret startup
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const result = spawnSync('docker', ['run', '--rm', 'rolefoundry-worker:ci'], {encoding:'utf8', timeout:10000});
          if (result.status !== 1 || !result.stderr.includes('Worker configuration is missing or invalid') || result.stderr.includes('ERR_MODULE_NOT_FOUND'))
            throw Error('Worker image startup check failed.');
          console.log('Worker runtime imports resolve; missing configuration fails closed.');
          JS

      - name: Verify isolated resume runtime in Linux
        run: node scripts/check-resume-worker-image.mjs rolefoundry-worker:ci
